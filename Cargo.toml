[package]
name = "wayland-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
ashpd = { version = "0.13.10", features = ["tokio", "remote_desktop", "screencast"] }
clap = { version = "4.6.1", features = ["derive"] }
enumflags2 = "0.7.12"
futures-util = "0.3"
image = "0.25.10"
libc = "0.2.186"
pipewire = "0.9.2"
reis = { version = "0.6.1", features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
zbus = { version = "5.15.0", default-features = false, features = ["tokio"] }
zvariant = "5"
